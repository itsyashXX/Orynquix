[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "orynquix"
version = "0.1.0a2"
description = "A touch-first, repairable no-root Linux workstation for Android and Termux"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ItsYashXX" }]
keywords = ["android", "termux", "linux", "proot", "xfce", "termux-x11"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Android",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
orynquix = "orynquix.cli:main"
orynquix-gui = "orynquix.gui:main"

[project.urls]
Homepage = "https://github.com/itsyashXX/Orynquix"
Repository = "https://github.com/itsyashXX/Orynquix"
Issues = "https://github.com/itsyashXX/Orynquix/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/orynquix"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["orynquix"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["orynquix"]
